# PaySnap Configuration
# Edit this file to change app behavior

app:
  name: "PaySnap"
  version: "1.0.0"
  default_language: "es"

# ─────────────────────────────────────────────
# Supported Languages
# Gemma 4 speaks all of these natively
# Add new languages here without changing Python
# ─────────────────────────────────────────────
languages:
  - code: "es"
    name: "Español"
    flag: "🇪🇸"
    default: true

  - code: "zh"
    name: "中文"
    flag: "🇨🇳"
    default: false

  - code: "pt"
    name: "Português"
    flag: "🇧🇷"
    default: false

  - code: "ht"
    name: "Kreyòl"
    flag: "🇭🇹"
    default: false

  - code: "vi"
    name: "Tiếng Việt"
    flag: "🇻🇳"
    default: false

  - code: "ko"
    name: "한국어"
    flag: "🇰🇷"
    default: false

  - code: "tl"
    name: "Filipino"
    flag: "🇵🇭"
    default: false

  - code: "hi"
    name: "हिन्दी"
    flag: "🇮🇳"
    default: false

  - code: "ar"
    name: "العربية"
    flag: "🇸🇦"
    default: false

  - code: "ru"
    name: "Русский"
    flag: "🇷🇺"
    default: false

  - code: "en"
    name: "English"
    flag: "🇺🇸"
    default: false

# ─────────────────────────────────────────────
# Supported US States
# Add new states by creating data/states/XX.json
# and listing here — no Python changes needed
# ─────────────────────────────────────────────
supported_states:
  - code: "CA"
    name_en: "California"
  - code: "TX"
    name_en: "Texas"
  - code: "NY"
    name_en: "New York"
  - code: "FL"
    name_en: "Florida"
  - code: "IL"
    name_en: "Illinois"

# ─────────────────────────────────────────────
# File Input Settings
# ─────────────────────────────────────────────
input:
  accepted_image_types: [".jpg", ".jpeg", ".png", ".webp"]
  accepted_document_types: [".pdf", ".docx", ".xlsx"]
  max_file_size_mb: 20
  ocr_confidence_threshold: 0.75

# ─────────────────────────────────────────────
# Model Routing (Cactus Track)
# Routes tasks to appropriate model
# ─────────────────────────────────────────────
model_routing:
  use_vision_for: ["image", "screenshot"]
  use_text_for: ["pdf_extracted", "doc_extracted", "followup_question"]
  confidence_fallback_threshold: 0.70

# ─────────────────────────────────────────────
# Ollama Settings
# Model runs locally — zero cloud
# ─────────────────────────────────────────────
ollama:
  base_url: "http://localhost:11434"
  vision_model: "gemma4:latest"
  text_model: "gemma4:latest"
  timeout_seconds: 180
  max_tokens: 2048

# ─────────────────────────────────────────────
# Legal Disclaimers
# Shown to user before first analysis
# ─────────────────────────────────────────────
disclaimer:
  show_on_first_launch: true
  must_accept: true
  text_es: |
    PaySnap te ayuda a entender tu recibo de pago.
    No es consejo legal. Todos los resultados deben
    discutirse con una oficina de Salarios y Horas
    o un abogado antes de tomar acción.
  text_en: |
    PaySnap helps you understand your paystub.
    It is not legal advice. All results should be
    discussed with a Wage and Hour office or attorney
    before taking action.

# ─────────────────────────────────────────────
# Security
# ─────────────────────────────────────────────
security:
  vault_filename: "paysnap_vault.enc"